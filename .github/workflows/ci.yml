name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gosync
          POSTGRES_PASSWORD: gosync
          POSTGRES_DB: gosync_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gosync"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GOSYNC_TEST_POSTGRES: postgres://gosync:gosync@localhost:5432/gosync_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: |
          go vet ./...
          GOOS=js GOARCH=wasm go vet ./cmd/gosync-wasm/
      - name: Test (SQLite + PostgreSQL, race detector)
        run: go test -race -count=1 ./...
      - name: Build server
        run: go build -o gosync-server ./cmd/gosync-server

  browser-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build WASM SDK
        run: node sdk/js/build.mjs --out examples/todo/gosync
      - name: Install test deps
        working-directory: sdk/js
        run: npm install --no-save fake-indexeddb@6
      - name: End-to-end test against a live server
        run: |
          go build -o gosync-server ./cmd/gosync-server
          GOSYNC_ADDR=127.0.0.1:8090 GOSYNC_INSECURE_DEV_AUTH=true GOSYNC_STATIC_DIR=examples/todo \
            GOSYNC_DATABASE_URL=/tmp/e2e.db ./gosync-server &
          for i in $(seq 1 50); do curl -sf http://127.0.0.1:8090/readyz && break; sleep 0.2; done
          node sdk/js/test/e2e.mjs
